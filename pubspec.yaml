name: spectrumpit
description: "FRC pit logistics app. Ships to iOS, Android, and desktop."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.0+6

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^8.2.1
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.11.0
  google_sign_in: ^7.2.0
  http: ^1.2.2
  # Our own pure-Dart Firebase Auth + Firestore REST client, extracted from
  # this app's desktop services and published for the ecosystem (#498). Gives
  # Linux (which FlutterFire does not support) real sign-in and cloud access.
  firestore_client:
    git:
      url: https://github.com/Project516/firestore_client.git
      ref: v0.2.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.1
  # Diagram picking for the maps tab (#9): file_selector over image_picker
  # since desktop is a ship target and image_picker's desktop support is
  # weak. path_provider locates the per-device app support dir the picked
  # image is copied into.
  file_selector: ^1.0.3
  path_provider: ^2.1.6
  # Packing photo capture (#63) forks the other way: mobile needs a camera,
  # which file_selector has no answer for, and image_picker's
  # maxWidth/maxHeight/imageQuality do the downscale and re-encode natively, so
  # a phone photo lands under the Worker's 2 MB cap with no image-processing
  # dependency. Desktop and web stay on file_selector, since neither has a
  # camera to shoot with.
  image_picker: ^1.2.3
  pub_semver: ^2.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_cloud_firestore: ^4.2.0
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - docs/
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
