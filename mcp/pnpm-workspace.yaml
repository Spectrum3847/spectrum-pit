allowBuilds:
  '@firebase/util': false
  protobufjs: false

# This package pulls in firebase-admin's dependency tree; these overrides
# pin past known advisories in it.
overrides:
  # GHSA advisory: uuid < 11.1.1 misses a buffer bounds check in v3/v5/v6.
  uuid: ^14.0.0
  # GHSA-hmw2-7cc7-3qxx: form-data < 2.5.6 allows CRLF injection via
  # unescaped multipart field names.
  form-data: ^4.0.0
  # GHSA-mh99-v99m-4gvg: brace-expansion below 5.0.8 expands without a length
  # bound and can OOM the process.
  rimraf: ^6.1.3
