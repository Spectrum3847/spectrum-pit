<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Spectrum Pit: FRC pit logistics app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Spectrum Pit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Spectrum Pit</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Prime IndexedDB for Firebase Auth before Flutter loads.

    iPad Safari in desktop mode (default since iPadOS 13) can fail the
    first IndexedDB read, which permanently wedges Firebase Auth: no
    auth state listener fires, signInWithPopup hangs, and signOut
    cannot recover (firebase/firebase-js-sdk#10311).

    The databases are created exactly as the SDK does, object store and
    keyPath included (auth: packages/auth indexed_db.ts, heartbeat:
    packages/app indexeddb.ts). A database that exists at version 1
    without its store would send the auth SDK through its
    delete-and-recreate recovery on every load, which is the flaky path
    this script exists to avoid, so a store found missing here is
    repaired the same way (#329).
  -->
  <script>
    (function() {
      function prime(name, store, options, retried) {
        try {
          var req = indexedDB.open(name, 1);
          req.onupgradeneeded = function() {
            if (!req.result.objectStoreNames.contains(store)) {
              req.result.createObjectStore(store, options);
            }
          };
          req.onsuccess = function() {
            var healthy = req.result.objectStoreNames.contains(store);
            req.result.close();
            if (!healthy && !retried) {
              var del = indexedDB.deleteDatabase(name);
              del.onsuccess = function() { prime(name, store, options, true); };
            }
          };
        } catch (e) {}
      }
      prime('firebaseLocalStorageDb', 'firebaseLocalStorage',
          { keyPath: 'fbase_key' }, false);
      prime('firebase-heartbeat-database', 'firebase-heartbeat-store',
          undefined, false);
      // An earlier version of this script created this misnamed, empty
      // database; the SDK never opens it (#329).
      try { indexedDB.deleteDatabase('firebase-heartbeat-storage'); } catch (e) {}
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
