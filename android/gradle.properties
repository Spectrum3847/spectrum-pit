org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# AGP 9's new DSL replaces AbstractAppExtension, which Flutter's own gradle
# plugin still casts to, so building with the new DSL on fails at
# plugin-apply time. These opt back out until the Flutter plugin catches up.
android.builtInKotlin=false
android.newDsl=false
